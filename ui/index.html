<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: akis-thumb: https://i.ytimg.com; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Akış</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 7h14M9 14h9M9 21h4M22 17v10m-4-4 4 4 4-4"/></svg></span><div><strong>akış<span>.</span></strong><small>İçerik yanında.</small></div></div>
        <div class="nav-caption">ÇALIŞMA ALANI</div>
        <nav aria-label="Ana menü">
          <button class="nav-item selected" data-page="download"><span data-icon="plus"></span>Yeni indirme</button>
          <button class="nav-item" data-page="queue"><span data-icon="queue"></span>Kuyruk<span class="nav-badge" id="queue-count">0</span></button>
          <button class="nav-item" data-page="library"><span data-icon="library"></span>Kütüphane</button>
        </nav>
        <div class="sidebar-bottom">
          <button class="nav-item" data-page="settings"><span data-icon="settings"></span>Ayarlar</button>
          <div class="engine-indicator"><span class="status-dot" id="engine-dot"></span><div><strong id="engine-label">Hazırlanıyor</strong><small id="app-version">Akış 1.0.0</small></div></div>
        </div>
      </aside>
      <div class="workspace">
        <header class="titlebar"><span>AKIŞ <span class="titlebar-divider">/</span> YOUTUBE İNDİRİCİ</span><div class="window-controls"><button data-window="minimize" aria-label="Simge durumuna küçült"><span data-icon="minus"></span></button><button data-window="maximize" aria-label="Büyüt veya geri yükle"><span data-icon="square"></span></button><button class="close-window" data-window="close" aria-label="Kapat"><span data-icon="close"></span></button></div></header>
        <main id="main"></main>
        <footer class="workspace-footer"><span><span class="footer-dot"></span>Bilgisayarına indir. İstediğin zaman aç.</span><button id="footer-folder"><span data-icon="folder"></span>İndirme klasörü</button></footer>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
