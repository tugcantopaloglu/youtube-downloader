name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag must match package.json version: v$version"
          }
      - name: Prepare release
        id: prepare
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $existing = gh release view "v$version" --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $assets = @((($existing | ConvertFrom-Json).assets | Where-Object { $_.state -eq 'uploaded' }).name)
            $required = @("DownTube-Setup-$version.exe", "DownTube-Setup-$version.exe.blockmap", 'latest.yml')
            if (@($required | Where-Object { $_ -notin $assets }).Count -eq 0) {
              'publish=false' >> $env:GITHUB_OUTPUT
              exit 0
            }
          } else {
            gh release create "v$version" --title "DownTube $version" --notes 'Windows x64 için DownTube kurulum dosyası.'
            if ($LASTEXITCODE -ne 0) { throw 'Release could not be created' }
          }
          'publish=true' >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        if: steps.prepare.outputs.publish == 'true'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload update block map
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          gh release upload "v$version" "release/DownTube-Setup-$version.exe.blockmap" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: steps.prepare.outputs.publish == 'true'
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
